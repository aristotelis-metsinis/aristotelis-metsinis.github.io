<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex">
		<title>Page not found - Homepages of Aristotelis Metsinis...</title>
		<script type="text/javascript">
			// GitHub Pages shows this page for every address that does not exist (the address bar keeps the requested
			// address). Old addresses of the curriculum vitae are sent to the curriculum vitae page of the site;
			// every other address gets the short note below. Only the file name is looked at (not the ?seed=... part).
			(function ()
			{
				var retired = ['aristotelis_metsinis.pdf', 'aristotelis_metsinis.docx'];   // curriculum vitae files that were renamed (now Aristotelis_Metsinis_Resume.*)
				try
				{
					var name = decodeURIComponent(location.pathname).split('/').pop().toLowerCase();
					for (var i = 0; i < retired.length; i++)
					{
						if (name === retired[i]) { location.replace('/index.html?redirectedFrom=cv.html'); return; }
					}
				}
				catch (e) {}
			})();
		</script>
		<style>
			body { margin: 0; padding: 48px 24px; background: #fbfaf5; color: #2b2a24; font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
			main { max-width: 34rem; margin: 0 auto; }
			h1 { margin: 0 0 12px; font-size: 1.35rem; line-height: 1.25; }
			p { margin: 0 0 12px; }
			ul { margin: 0; padding-left: 1.2em; }
			li { margin: 6px 0; }
			a { color: #1f6178; }
			a:focus-visible { outline: 3px solid #0b6bcb; outline-offset: 2px; border-radius: 3px; }
		</style>
	</head>
	<body>
		<main>
			<h1>Page not found</h1>
			<p>This address does not exist (any more). You may want to go to:</p>
			<ul>
				<li><a href="/index.html">the main page of the site</a></li>
				<li><a href="/index.html?redirectedFrom=cv.html">the curriculum vitae</a></li>
			</ul>
		</main>
	</body>
</html>
